<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0b1929"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1f6feb" stroke-width="0.5" opacity="0.28"/>
    </pattern>
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#58a6ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
    <style>
      @keyframes breathe {0%,100%{opacity:.45;transform:scale(1)}50%{opacity:.9;transform:scale(1.04)}}
      @keyframes sweep {0%{transform:translateX(-100%)}100%{transform:translateX(1200px)}}
      @keyframes dash {to{stroke-dashoffset:-240}}
      .ring{animation:breathe 5s ease-in-out infinite;transform-origin:980px 160px}
      .scan{animation:sweep 9s linear infinite}
      .orbit{stroke-dasharray:6 10;animation:dash 12s linear infinite}
      @media (prefers-reduced-motion:reduce){.ring,.scan,.orbit{animation:none}}
    </style>
  </defs>
  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <circle cx="980" cy="160" r="200" fill="url(#glow)"/>
  <circle class="ring" cx="980" cy="160" r="86" fill="none" stroke="#58a6ff" stroke-width="2" opacity="0.6"/>
  <circle class="orbit" cx="980" cy="160" r="112" fill="none" stroke="#39c5cf" stroke-width="1.5" opacity="0.75"/>
  <circle cx="980" cy="160" r="56" fill="none" stroke="#58a6ff" stroke-width="1" opacity="0.9"/>
  <circle cx="980" cy="160" r="30" fill="#58a6ff" opacity="0.18"/>
  <text x="980" y="170" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="22" font-weight="700" fill="#58a6ff">365</text>
  <rect class="scan" y="0" width="160" height="320" fill="url(#scan)" opacity="0.35"/>
  <text x="64" y="150" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="72" font-weight="800" fill="#f0f6fc">itboy365</text>
  <text x="66" y="196" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="19" fill="#8b949e">河北保定 · 独立开发者 / Baoding · Independent Developer</text>
  <text x="66" y="232" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" fill="#58a6ff">// FRONTEND · QUANT · DIGITAL IDENTITY</text>
  <line x1="64" y1="262" x2="1136" y2="262" stroke="#30363d" stroke-width="1"/>
</svg>
